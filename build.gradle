plugins {
    id "groovy"
    id "com.gradleup.shadow" version "9.6.1"
    id "application"
    id "io.micronaut.application" version "5.0.2"
}

version = "1.0"
group = "com.menome"

repositories {
    mavenCentral()
}

dependencies {
    implementation(platform("io.micronaut.platform:micronaut-platform:$micronautVersion"))
    compileOnly('info.picocli:picocli-codegen')

    implementation("io.micronaut:micronaut-inject")
    implementation("io.micronaut:micronaut-http-server-netty")
    implementation("io.micronaut.groovy:micronaut-runtime-groovy")
    implementation("io.micronaut.picocli:micronaut-picocli")
    implementation("io.micronaut:micronaut-management")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut.micrometer:micronaut-micrometer-core")
    implementation("io.micronaut.micrometer:micronaut-micrometer-registry-prometheus")
    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("org.yaml:snakeyaml")

    implementation('com.google.code.gson:gson:2.15.0')
    implementation('org.apache.commons:commons-lang3:3.21.0')
    implementation('com.rabbitmq:amqp-client:5.37.0')
    implementation('io.projectreactor.rabbitmq:reactor-rabbitmq:1.5.6')
    implementation('org.neo4j.driver:neo4j-java-driver:6.3.0')
    implementation('com.github.erosb:everit-json-schema:1.14.6')

    testImplementation(platform("io.micronaut.platform:micronaut-platform:$micronautVersion"))
    testImplementation("io.micronaut:micronaut-inject-groovy")
    testImplementation("io.micronaut.test:micronaut-test-spock")
    testImplementation("org.spockframework:spock-core:2.4-groovy-5.0") {
        exclude group: "org.apache.groovy"
    }
    testImplementation('org.awaitility:awaitility-groovy:4.3.0')
    testImplementation("org.testcontainers:testcontainers:2.0.5")
    testImplementation("org.testcontainers:testcontainers-rabbitmq:2.0.5")
    testImplementation("org.testcontainers:testcontainers-neo4j:2.0.5")
    testImplementation("org.testcontainers:testcontainers-spock:2.0.5")
    testImplementation('io.projectreactor:reactor-test')
}

test {
    useJUnitPlatform()
    forkEvery = 1
}

application {
    mainClass = "com.menome.MessageServerCommand"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

micronaut {
    runtime("netty")
    testRuntime("spock2")
    processing {
        incremental(true)
        annotations("com.menome.*")
    }
}

shadowJar {
    mergeServiceFiles()
    zip64 = true
}

// Throughput benchmark (KANBAN E1-1): own source set so it never ships in the jar, runs against the NEO4J_* env vars
sourceSets {
    benchmark {
        groovy.srcDir 'src/benchmark/groovy'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    // Lets the unit specs cover the workload generators without a database
    testImplementation(sourceSets.benchmark.output)
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the throughput benchmark; pass options with --args="--profiles=hubs3 --messages=20000"'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.menome.benchmark.BenchmarkRunner'
    workingDir = projectDir
    dependsOn classes
    // A measurement is never "up to date": running it again with the same arguments must run it again
    outputs.upToDateWhen { false }
}

// The ceiling (KANBAN E10-1): what the database takes for the server's own statements with nothing else around them
tasks.register('ceiling', JavaExec) {
    group = 'verification'
    description = 'Runs the database ceiling benchmark; pass options with --args="--profiles=hubs3 --messages=150000 --sessions=1,4"'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.menome.benchmark.CeilingRunner'
    workingDir = projectDir
    dependsOn classes
    outputs.upToDateWhen { false }
}

// What one bad message costs a batch, and message sizes (KANBAN E3-14)
tasks.register('bisect', JavaExec) {
    group = 'verification'
    description = 'Measures the cost of one bad message per batch size; --args="--profiles=node-only --batches=500,2000 --repeats=5"'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.menome.benchmark.BisectCost'
    workingDir = projectDir
    dependsOn classes
    outputs.upToDateWhen { false }
}

// The benchmark needs the full JIT, so it is the one JavaExec task that skips these flags
tasks.withType(JavaExec).configureEach {
    if (name == 'benchmark' || name == 'ceiling' || name == 'bisect') return
    jvmArgs('-XX:TieredStopAtLevel=1', '-Dcom.sun.management.jmxremote')
}
