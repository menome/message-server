services:
  neo4j:
    image: neo4j:2026.10.1
    hostname: neo4j
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_db_query_default__language: CYPHER_25
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "messageserver"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-messageserver}"
  message-server:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
      - neo4j
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-messageserver}"
      NEO4J_HOST: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      ENABLE_TEST_ENDPOINTS: "${ENABLE_TEST_ENDPOINTS:-N}"
